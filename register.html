
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join SkillShareConnect</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .auth-wrapper {
            min-height: 85vh;
            padding: 45px 20px;
            display: grid;
            place-items: center;
            background: #F3F5EF;
        }

        .auth-card {
            width: 100%;
            max-width: 520px;
            padding: 35px;
            background: white;
            border: 1px solid #E4E9E0;
            border-radius: 20px;
            box-shadow: 0 15px 45px #294B3A12;
        }

        .auth-card h1 {
            color: #294B3A;
            font-size: 29px;
            margin-bottom: 8px;
        }

        .auth-card > p {
            color: #727B74;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .auth-card label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 15px 0 6px;
        }

        .auth-card input,
        .auth-card select,
        .auth-card textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #DDE3DA;
            border-radius: 8px;
            box-sizing: border-box;
            font: inherit;
            font-size: 13px;
            background: #FCFCF9;
        }

        .auth-card input:focus,
        .auth-card select:focus,
        .auth-card textarea:focus {
            outline: 2px solid #B9CEBC;
        }

        .skill-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .skill-options label {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0;
            padding: 10px;
            background: #F3F5EF;
            border-radius: 8px;
            font-weight: 400;
        }

        .skill-options input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .custom-skill-box {
            margin-top: 14px;
            padding: 15px;
            background: #F3F5EF;
            border: 1px solid #DDE3DA;
            border-radius: 10px;
        }

        .custom-skill-box label {
            margin-top: 0;
        }

        .custom-skill-box small {
            display: block;
            margin-top: 7px;
            color: #727B74;
            line-height: 1.5;
        }

        .auth-submit {
            width: 100%;
            border: none;
            margin-top: 25px;
            cursor: pointer;
            font-family: inherit;
        }

        .auth-message {
            margin-top: 15px;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .auth-bottom {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .auth-bottom a {
            color: #557761;
            font-weight: 600;
        }

        @media (max-width: 450px) {
            .auth-card {
                padding: 23px;
            }

            .skill-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">SkillShare<span>Connect</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-wrapper">
        <section class="auth-card">
            <p class="section-tag">BECOME PART OF OUR COMMUNITY</p>
            <h1>Create your account 🌱</h1>
            <p>Share your skills and help make a difference.</p>

            <form id="registerForm">
                <label for="name">Full Name *</label>
                <input id="name" name="name" required maxlength="80"
                       autocomplete="name" placeholder="Enter your full name">

                <label for="email">Email Address *</label>
                <input id="email" name="email" type="email" required
                       autocomplete="email" placeholder="you@example.com">

                <label for="password">Password *</label>
                <input id="password" name="password" type="password"
                       minlength="8" maxlength="72" required
                       autocomplete="new-password"
                       placeholder="At least 8 characters">

                <label for="age">Age Group</label>
                <select id="age" name="age">
                    <option value="">Select age group</option>
                    <option>Under 18</option>
                    <option>18-24</option>
                    <option>25-34</option>
                    <option>35-44</option>
                    <option>45-59</option>
                    <option>60+</option>
                </select>

                <label for="role">What best describes you?</label>
                <select id="role" name="role">
                    <option>Student</option>
                    <option>Working Professional</option>
                    <option>Self-employed</option>
                    <option>Homemaker</option>
                    <option>Community Volunteer</option>
                    <option>Retired</option>
                    <option>Other</option>
                </select>

                <label>Skills you can share</label>

                <div class="skill-options">
                    <label>
                        <input type="checkbox" name="skills" value="Teaching">
                        Teaching
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Technology">
                        Technology
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Art and Design">
                        Art and Design
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Sports and Fitness">
                        Sports and Fitness
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Cooking">
                        Cooking
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Communication">
                        Communication
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Repair Skills">
                        Repair Skills
                    </label>

                    <label>
                        <input type="checkbox" name="skills" value="Computer Science">
                        Computer Science
                    </label>

                    <label>
                        <input type="checkbox" id="otherSkillCheckbox"
                               name="skills" value="Other">
                        Other
                    </label>
                </div>

                <div id="customSkillBox" class="custom-skill-box" hidden>
                    <label for="customSkills">
                        Enter your other skills
                    </label>

                    <textarea
                        id="customSkills"
                        name="customSkills"
                        rows="3"
                        maxlength="300"
                        placeholder="Example: Python, Java, Web Development, Graphic Design"
                        aria-describedby="customSkillHelp"
                    ></textarea>

                    <small id="customSkillHelp">
                        You can enter multiple skills, separated by commas.
                    </small>
                </div>

                <label for="bio">About You</label>
                <textarea id="bio" name="bio" rows="3" maxlength="500"
                          placeholder="Tell us how you would like to help"></textarea>

                <button class="primary-button auth-submit" type="submit">
                    Create Account →
                </button>

                <p id="registerMessage" class="auth-message" role="status"></p>
            </form>

            <div class="auth-bottom">
                Already registered? <a href="login.html">Login here</a>
            </div>
        </section>
    </main>

    <footer>
        <a href="index.html" class="logo">SkillShare<span>Connect</span></a>
        <p>Share knowledge. Spread kindness.</p>
    </footer>

    <script>
        const otherSkillCheckbox = document.getElementById("otherSkillCheckbox");
        const customSkillBox = document.getElementById("customSkillBox");
        const customSkillsInput = document.getElementById("customSkills");

        function toggleCustomSkills() {
            customSkillBox.hidden = !otherSkillCheckbox.checked;

            if (!otherSkillCheckbox.checked) {
                customSkillsInput.value = "";
            }
        }

        otherSkillCheckbox.addEventListener("change", toggleCustomSkills);
        toggleCustomSkills();
    </script>

    <script src="script.js"></script>
    <script src="register.js"></script>
</body>
</html>
