
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SkillShareConnect</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f7f5ed, #e6eee7, #eee8f7);
            min-height: 100vh;
        }

        .login-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
        }

        .login-header h2 {
            color: #345b49;
            margin: 0;
        }

        .login-header a {
            text-decoration: none;
            color: #345b49;
            font-weight: bold;
            margin-left: 18px;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 15px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(40, 70, 50, 0.12);
            box-sizing: border-box;
        }

        .login-card h1 {
            text-align: center;
            color: #345b49;
            margin-bottom: 10px;
        }

        .login-card p {
            text-align: center;
            color: #68756c;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #37483e;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8e1d9;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #648b72;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #416b54;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #31533f;
        }

        #loginMessage {
            margin-top: 15px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .register-link {
            margin-top: 22px;
            text-align: center;
            color: #68756c;
        }

        .register-link a {
            color: #416b54;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px 20px;
            }

            .login-header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header class="login-header">
        <h2>SkillShareConnect</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Join Us</a>
        </nav>
    </header>

    <main class="login-container">
        <section class="login-card">
            <h1>Welcome Back!</h1>

            <p>Log in to share your skills and make a difference.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Login to Your Account
                </button>

                <p id="loginMessage" role="status"></p>
            </form>

            <div class="register-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </div>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
